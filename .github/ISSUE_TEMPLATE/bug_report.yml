name: Hata bildirimi
description: Bir script beklendiği gibi çalışmıyor
title: "[hata] "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler! Hatayı hızlıca çözebilmek için aşağıdaki bilgileri doldurun.

  - type: dropdown
    id: modul
    attributes:
      label: Modül
      description: Sorun hangi modülde?
      options:
        - 01-multipass-cluster-maker
        - Kök Makefile / lib
        - Dokümantasyon
        - Diğer
    validations:
      required: true

  - type: input
    id: komut
    attributes:
      label: Çalıştırılan komut
      placeholder: "make cluster CPUS=4"
    validations:
      required: true

  - type: textarea
    id: beklenen
    attributes:
      label: Ne olmasını bekliyordunuz?
    validations:
      required: true

  - type: textarea
    id: gerceklesen
    attributes:
      label: Ne oldu?
      description: Terminal çıktısını olduğu gibi yapıştırın.
      render: text
    validations:
      required: true

  - type: textarea
    id: ortam
    attributes:
      label: Ortam
      description: |
        Aşağıdaki komutların çıktısını ekleyin.
      value: |
        - İşletim sistemi: (lsb_release -d)
        - Bash sürümü: (bash --version | head -1)
        - Multipass: (multipass version)
        - make preflight çıktısı:
      render: text
    validations:
      required: true
