title: scripts
description: Günlük işleri kolaylaştıran kişisel bash script koleksiyonu
lang: tr

remote_theme: just-the-docs/just-the-docs@v0.12.0

url: https://cagatayuresin.github.io
baseurl: /scripts

# --- Arama -----------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

# --- Gorunum ---------------------------------------------------------------
color_scheme: light
enable_copy_code_button: true
nav_sort: case_insensitive
heading_anchors: true

back_to_top: true
back_to_top_text: "Başa dön"

# --- GitHub baglantilari ---------------------------------------------------
aux_links:
  "GitHub'da görüntüle":
    - "https://github.com/cagatayuresin/scripts"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Bu sayfayı GitHub'da düzenle"
gh_edit_repository: "https://github.com/cagatayuresin/scripts"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

footer_content: 'MIT Lisansı ile dağıtılır · <a href="https://github.com/cagatayuresin">cagatayuresin</a>'

# --- Jekyll ----------------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
